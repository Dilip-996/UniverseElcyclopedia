name: Production build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EXP-Project
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: EXP-Project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: npm run build
